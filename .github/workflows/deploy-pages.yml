# Builds the whole solution, then publishes the WebAssembly demo to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Build & deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build everything (catches compile errors in every project)
        run: dotnet build AirportOps.slnx -c Release

      - name: Publish browser demo
        run: dotnet publish src/Airport.Web/Airport.Web.csproj -c Release -o publish

      - name: Prepare for GitHub Pages
        run: |
          # The site lives under https://<user>.github.io/<repo>/
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish/wwwroot/index.html
          # Deep links (e.g. /flights) fall back to the app.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # Let files/folders starting with "_" (like _framework) through.
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
